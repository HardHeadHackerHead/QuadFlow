name: Feature request
description: Suggest an idea or improvement for QuadFlow.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Many features fit best as a **plugin** --
        if yours could be one, say so below.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like QuadFlow to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: scope
    attributes:
      label: Where does this belong?
      options:
        - Core app (terminals, layout, workspaces, settings)
        - quadflow CLI
        - Plugin API / plugin system
        - An existing plugin
        - A new plugin
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
