name: Bug report
description: Something in QuadFlow is broken or behaves unexpectedly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        existing issues first to avoid duplicates.
        **Security vulnerabilities must not be reported here** -- see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Add a Claude Code terminal
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: QuadFlow version
      description: Shown in Settings -> About, or the release you installed. Use the commit hash for source builds.
      placeholder: "1.1.2"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: "Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04"

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Terminals / agents
        - Layout / workspaces / projects
        - quadflow CLI
        - Plugin system
        - A specific plugin (Ideas, Issues, Plans, Scripts, Ship, Chat, Missions, ...)
        - Updater / installer
        - Other

  - type: input
    id: agent
    attributes:
      label: Agent CLI and version (if relevant)
      placeholder: "Claude Code 2.x / Codex 0.x"

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Relevant log output (the app's log directory, or Settings -> Diagnostics) and screenshots.
        Please remove anything private before posting.
      render: shell
