[package]
name = "youtube-live-sidecar"
version = "1.0.0"
description = "Sidecar of the YouTube Live plugin: chat poller, points / slot machine, polls, OAuth (all network through the host's http.fetch)"
authors = ["QuadFlow contributors"]
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[[bin]]
name = "youtube-live-sidecar"
path = "src/main.rs"

[dependencies]
quadflow-sidecar = { path = "../../../packages/sidecar-sdk-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same rusqlite as the app crates (one `links = "sqlite3"` per workspace).
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
urlencoding = "2"
