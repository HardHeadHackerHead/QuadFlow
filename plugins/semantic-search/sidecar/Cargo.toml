[package]
name = "semantic-search-sidecar"
version = "1.0.0"
description = "Sidecar of the optional Semantic Search plugin: indexes agent session transcripts into local embeddings (Candle) and searches them"
authors = ["QuadFlow contributors"]
license = "AGPL-3.0-only"
edition = "2021"
publish = false

# Not in the workspace's default-members: the app never compiles this crate (or candle).
# Build it with `cargo build --release -p semantic-search-sidecar` (npm run build in
# plugins/semantic-search does that). GPU builds: `--features cuda` / `--features metal`.

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
quadflow-sidecar = { path = "../../../packages/sidecar-sdk-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6.1"
regex = "1.10"
globset = "0.4"
walkdir = "2"
