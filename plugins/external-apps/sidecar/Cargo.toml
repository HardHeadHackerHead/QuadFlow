[package]
name = "external-apps-sidecar"
version = "1.0.0"
description = "Sidecar of the external-apps QuadFlow plugin: launch apps, list/focus windows, embed windows into tiles (Win32)"
authors = ["QuadFlow contributors"]
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[dependencies]
quadflow-sidecar = { path = "../../../packages/sidecar-sdk-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same major as the app crate so the workspace keeps one `windows` in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
